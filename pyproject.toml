[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mbqc-rl"
version = "0.1.0"
description = "Reinforcement learning for measurement-order optimisation in MBQC"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "torch>=2.0.0",
    "pyzx>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mbqc_rl*"]
